<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="50%" stop-color="#1e40af" />
      <stop offset="100%" stop-color="#172554" />
    </linearGradient>
    <linearGradient id="docGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Document 1 (Back document) -->
  <g filter="url(#shadow)">
    <rect x="140" y="80" width="220" height="310" rx="16" fill="#94a3b8" opacity="0.4" transform="rotate(-6 250 235)" />
    <!-- Main Invoice Document -->
    <rect x="120" y="90" width="230" height="320" rx="16" fill="url(#docGrad)" />
  </g>

  <!-- Document Header lines -->
  <rect x="150" y="130" width="90" height="14" rx="4" fill="#1e40af" />
  <rect x="290" y="130" width="36" height="14" rx="4" fill="#94a3b8" />
  
  <rect x="150" y="165" width="170" height="8" rx="4" fill="#cbd5e1" />
  <rect x="150" y="185" width="130" height="8" rx="4" fill="#cbd5e1" />

  <!-- Table mockup lines -->
  <line x1="150" y1="215" x2="320" y2="215" stroke="#e2e8f0" stroke-width="2" />
  <rect x="150" y="230" width="100" height="8" rx="4" fill="#94a3b8" />
  <rect x="280" y="230" width="40" height="8" rx="4" fill="#64748b" />
  
  <rect x="150" y="250" width="110" height="8" rx="4" fill="#94a3b8" />
  <rect x="280" y="250" width="40" height="8" rx="4" fill="#64748b" />

  <rect x="150" y="270" width="90" height="8" rx="4" fill="#94a3b8" />
  <rect x="280" y="270" width="40" height="8" rx="4" fill="#64748b" />

  <line x1="150" y1="295" x2="320" y2="295" stroke="#cbd5e1" stroke-width="2" />
  
  <!-- Total Row -->
  <rect x="150" y="310" width="60" height="10" rx="3" fill="#1e40af" />
  <rect x="260" y="310" width="60" height="10" rx="3" fill="#1e40af" />

  <!-- e-Fatura Badge / Seal -->
  <g filter="url(#shadow)">
    <circle cx="340" cy="340" r="64" fill="url(#accentGrad)" stroke="#ffffff" stroke-width="6" />
    <!-- Checkmark -->
    <path d="M312 340 L332 360 L372 320" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- PT Monogram on bottom left -->
  <rect x="150" y="350" width="38" height="24" rx="4" fill="#dc2626" opacity="0.9" />
  <text x="169" y="367" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="13" fill="#ffffff" text-anchor="middle">PT</text>
</svg>
